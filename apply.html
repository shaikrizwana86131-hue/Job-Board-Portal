<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Job - CareerConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">
            <h1>CareerConnect</h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#jobs">Find Jobs</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
        </nav>
    </header>

    <!-- Application Form -->
    <section class="application-section">

        <div class="application-container">

            <h2>Job Application Form</h2>
<p>Fill in your details to apply for a job.</p>

<div class="selected-job">
    <h3>Applying for: <span id="selectedJob">Job Position</span></h3>
</div>

            <form id="applicationForm">

                <label for="fullName">Full Name</label>
                <input type="text" id="fullName"
                       placeholder="Enter your full name"
                       minlength="3" required>

                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter your email" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone"
                       placeholder="Enter 10-digit phone number"
                       pattern="[0-9]{10}"
                       title="Enter a valid 10-digit phone number"
                       required>

                <label for="qualification">Qualification</label>
                <select id="qualification" required>
                    <option value="">Select Qualification</option>
                    <option value="B.Tech">B.Tech</option>
                    <option value="B.Sc">B.Sc</option>
                    <option value="BCA">BCA</option>
                    <option value="M.Tech">M.Tech</option>
                    <option value="MCA">MCA</option>
                </select>

                <label for="skills">Skills</label>
                <textarea id="skills"
                          placeholder="Enter your technical skills"
                          rows="4" required></textarea>

                <label for="resume">Upload Resume (PDF)</label>
                <input type="file" id="resume"
                       accept=".pdf,application/pdf" required>

                <button type="submit" class="btn">
                    Submit Application
                </button>

            </form>

            <p id="successMessage" role="status"></p>

        </div>

    </section>

    <footer>
        <p>&copy; 2026 CareerConnect. All Rights Reserved.</p>
    </footer>

    <script src="application.js"></script>

</body>
</html>
